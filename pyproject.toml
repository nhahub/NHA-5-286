[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-test-automation"
version = "0.1.0"
description = "Black-box AI testing tool: requirement in, test report out."
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    # MCP adapter (spec §3 — official Playwright MCP via langchain-mcp-adapters)
    "langchain-mcp-adapters>=0.1",
    # Contracts
    "pydantic>=2.0",
    # LLM providers loaded through init_chat_model (spec §6)
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # UI (spec §11 — Gradio for the two-field MVP form)
    "gradio>=4.0",
    # Report templates (spec §10)
    "jinja2>=3.1",
    # PDF export: Chromium page.pdf (spec §10 MVP)
    "playwright>=1.48",
    # Word export (spec §10 Phase 2)
    "python-docx>=1.1",
    # HTTP safety checks (spec §7)
    "httpx>=0.27",
    # Environment config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ai-test = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: needs Node, tsc and Playwright installed"]

[tool.hatch.build.targets.wheel]
packages = [
    "contracts",
    "intake",
    "agents",
    "validation",
    "execution",
    "analysis",
    "healing",
    "graph",
    "llm",
    "report",
    "ui",
]
